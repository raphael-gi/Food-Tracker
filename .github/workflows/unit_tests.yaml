name: Release

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Tests
        run: |
          chmod +x gradlew
          ./gradlew testProdDebugUnitTest

