name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get version name
        run: |
          chmod +x gradlew
          VERSION_NAME=$(./gradlew -q :app:versionName)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew assembleProdRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/prod/release/app-prod-release.apk \
             app/build/outputs/apk/prod/release/food-tracker-${VERSION_NAME}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Food Tracker ${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/prod/release/food-tracker-${{ env.VERSION_NAME }}.apk

